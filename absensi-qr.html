<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPRES QR - Kios Absensi SPPG Cihaur</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d1b2a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1b263b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    h1 { color: #e0a96d; margin-bottom: 5px; }
    p { color: #e0e1dd; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 6px;
      border: 1px solid #415a77;
      background-color: #0d1b2a;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
      text-align: center;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .btn-masuk { background-color: #2a9d8f; color: white; }
    .btn-pulang { background-color: #e76f51; color: white; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h1>SIPRES QR</h1>
    <p>Kios Absensi SPPG Jeungjing</p>

    <input type="text" id="qrToken" placeholder="Scan / Ketik Token QR" autofocus>

    <div class="btn-group">
      <button class="btn-masuk" onclick="prosesAbsen('MASUK')">MASUK</button>
      <button class="btn-pulang" onclick="prosesAbsen('PULANG')">PULANG</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbynGbjvyxeG1PcFwUxNGblKVuLsqOIWLqF4ZuPci23r23bvYgh9NhRjjTXVmcmf77uH/exec";

    async function prosesAbsen(jenis) {
      const tokenInput = document.getElementById("qrToken");
      const statusDiv = document.getElementById("status");
      const token = tokenInput.value.trim();

      if (!token) {
        statusDiv.style.color = "#ff4d4d";
        statusDiv.innerText = "Masukkan Token QR terlebih dahulu!";
        return;
      }

      statusDiv.style.color = "#ffb703";
      statusDiv.innerText = "Memproses absensi...";

      try {
        const response = await fetch(`${API_URL}?action=scanQR&qr_token=${encodeURIComponent(token)}&jenis=${jenis}`);
        const result = await response.json();

        if (result.status === "success") {
          statusDiv.style.color = "#2a9d8f";
          statusDiv.innerText = `✅ ${result.message} (${result.nama} - ${result.waktu})`;
          tokenInput.value = "";
        } else {
          statusDiv.style.color = "#ff4d4d";
          statusDiv.innerText = `❌ ${result.message}`;
        }
      } catch (err) {
        statusDiv.style.color = "#ff4d4d";
        statusDiv.innerText = "Gagal terhubung ke server!";
      }
    }
  </script>
</body>
</html>
